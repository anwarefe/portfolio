name: Repair portfolio HTML
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore markup and commit corrected page
        shell: bash
        run: |
          python3 - &'lt';&'lt;'&'lt;'&'lt;'&'lt;'PY'
          import re
          from pathlib import Path
          path = Path("index.html")
          raw = path.read_text(encoding="utf-8")
          lt = chr(60)
          if raw.lstrip().startswith(lt):
              print("HTML already fixed")
          else:
              names = "html|head|meta|title|style|body|header|footer|main|div|section|nav|h1|h2|h3|article|span|small|em|strong|p|b|a|label|aside|br|link|button|i"
              tags = "(?:" + names + ")"
              lb = "(?" + lt + "![\\w./#-])"
              raw = re.sub(r"!doctype\\s+html>", "__DT__", raw, flags=re.I)
              raw = re.sub(r"/"+tags+r">", lambda m: lt + m.group(), raw, flags=re.I)
              attrs = r"\\s+(?:class|id|lang|dir|href|rel|name|content|charset|type|property|target|aria-label|aria-labelledby|role|src|style|aria-hidden)\\s*=\\s*[^>]*>"
              raw = re.sub(lb+tags+attrs, lambda m: lt + m.group(), raw, flags=re.I)
              raw = re.sub(lb+tags+r">", lambda m: lt + m.group(), raw, flags=re.I)
              raw = raw.replace("br>", lt+"br>").replace(lt+lt+"br>", lt+"br>")
              raw = raw.replace("__DT__", lt+"!doctype html>")
              path.write_text(raw, encoding="utf-8")
              print("Restored HTML tags; characters:", len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore valid portfolio HTML markup"
            git push
          fi
